<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Dashboard</title>
    <link rel="stylesheet" href="style.css"> </head>
<body>
    <div class="wrapper">
        <div class="login-box">
            <div class="login-header">
                <span>Welcome</span>
            </div>
            <div style="color: white; text-align: center; margin-top: 20px;">
                <p id="user-display">Loading user info...</p>
                <button id="logout-btn" class="input-submit" style="margin-top: 20px;">Logout</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // IMPORTANT: Use your exact Firebase Config here
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Security Check: If not logged in, send back to login page
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('user-display').innerText = "Hello, " + user.email;
            } else {
                window.location.href = "index.html";
            }
        });

        // Logout logic
        document.getElementById('logout-btn').addEventListener('click', () => {
            signOut(auth).then(() => window.location.href = "index.html");
        });
    </script>
</body>
</html>
